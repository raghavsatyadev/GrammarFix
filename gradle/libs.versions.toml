[versions]

# App Name
releaseAppName = "GrammarFix"

# Package Names
nameSpace = "com.raghavsatyadev.grammarfix"
appIdProd = "com.raghavsatyadev.grammarfix"
sharedAndroidId = "com.raghavsatyadev.grammarfix.android.library"

# SDK Versions
targetSdk = "37"
minSdk = "26"
compileSdk = "37"
# Compose 1.13 alphas need the 37.1 platform (minor SDK release).
compileSdkMinor = "1"
ndk = "30.0.15729638"
cmake = "4.1.2"

buildTools = "36.1.0"

# App Version Codes
versionCode = "1"
versionName = "0.0.1"

# Plugin Versions
agp = "9.5.0-alpha08"
kotlin = "2.5.0-Beta1"
compose-icons-extended-mp = "1.7.3"
screenshot = "0.0.1-alpha16"
ksp = "2.3.12"
room3 = "3.1.0-alpha01"

# Library Versions
activity = "1.14.0-alpha03"
compose-constraint-mp = "0.8.2"
compose-material3-mp = "1.13.0-alpha01"
compose-multiplatform = "1.13.0-alpha01"
compose-ui = "1.13.0-alpha03"
coroutines = "1.11.0"
koin = "4.2.2"
lifecycle-mp = "2.11.0"
serialization = "1.12.0-RC"
sqlite = "2.8.0-alpha01"
sonarqube = "7.5.0.8588"
splashscreen = "1.2.0"
leakcanary = "3.0-alpha-9"

# Testing
junit = "4.13.2"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
robolectric = "4.17"

# Networking & On-device AI
ktor = "3.6.0"

[libraries]
# Room / SQLite (KMP persistence)
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# Unit tests run on the host JVM, where the Android artifact has no native SQLite to load.
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }

# Android
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

#Compose
compose-activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }

compose-ui-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose-ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-ui" }
screenshot-validation-api = { group = "com.android.tools.screenshot", name = "screenshot-validation-api", version.ref = "screenshot"}

# Compose Multiplatform
compose-ui-mp = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-foundation-mp = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-material3-mp = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3-mp" }
compose-components-resources-mp = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
compose-ui-tooling-preview-mp = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-multiplatform" }
compose-runtime-mp = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-constraint-mp = { module = "tech.annexflow.compose:constraintlayout-compose-multiplatform", version.ref = "compose-constraint-mp" }
compose-icons-extended-mp = { module = "org.jetbrains.compose.material:material-icons-extended", version.ref = "compose-icons-extended-mp" }

#Kotlin
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Lifecycle Multiplatform
lifecycle-viewmodel-compose-mp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle-mp" }
lifecycle-runtime-compose-mp = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle-mp" }

# Koin
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

# Koin Multiplatform
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose-mp = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel-mp = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# LeakCanary
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose-ui" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose-ui" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Ktor Client
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }

sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }

[bundles]
android = [
    "androidx-splashscreen",
    "compose-ui-preview",
    "compose-activity",
]
koin-android = [
    "koin-core",
    "koin-android",
    "koin-androidx-compose",
    "koin-compose-mp",
    "koin-compose-viewmodel-mp",
]
compose-mp = [
    "compose-ui-mp",
    "compose-ui-tooling-preview-mp",
    "compose-foundation-mp",
    "compose-material3-mp",
    "compose-components-resources-mp",
    "compose-runtime-mp",
    "compose-constraint-mp",
    "compose-icons-extended-mp",
]
koin-mp = [
    "koin-core",
    "koin-compose-mp",
    "koin-compose-viewmodel-mp",
]
lifecycle-mp = [
    "lifecycle-viewmodel-compose-mp",
    "lifecycle-runtime-compose-mp",
]
